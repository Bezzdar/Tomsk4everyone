version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: tomsk_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: tomsk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tomsk_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@tomsk.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - postgres

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tomsk_backend
    restart: always
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - uploads:/var/www/tomsk/uploads

volumes:
  pgdata:
  uploads:
