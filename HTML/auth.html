<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="api-base" content="/api">
  <title>Tomsk4everyone — Вход и регистрация</title>
  <link rel="stylesheet" href="../CSS/auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="auth">
    <section class="auth-card">
      <a class="back-link" href="../index.html">← на главную</a>
      <header class="auth-header">
        <h1>Личный кабинет</h1>
        <p>Войдите или создайте аккаунт, чтобы сохранять прогресс и публиковать статьи.</p>
      </header>

      <div class="tabs" role="tablist">
        <button class="tab-button active" data-view="login" role="tab" aria-selected="true">Вход</button>
        <button class="tab-button" data-view="register" role="tab" aria-selected="false">Регистрация</button>
      </div>

      <form id="loginForm" class="auth-form active" novalidate autocomplete="on">
        <div class="field">
          <label for="loginEmail">Электронная почта</label>
          <input type="email" id="loginEmail" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="loginPassword">Пароль</label>
          <input type="password" id="loginPassword" name="password" required minlength="8" autocomplete="current-password">
        </div>
        <button type="submit" class="primary">Войти</button>
      </form>

      <form id="registerForm" class="auth-form" novalidate autocomplete="on">
        <div class="grid">
          <div class="field">
            <label for="registerName">Имя и фамилия</label>
            <input type="text" id="registerName" name="name" required autocomplete="name" placeholder="Иван Иванов">
          </div>
          <div class="field">
            <label for="registerEmail">Электронная почта</label>
            <input type="email" id="registerEmail" name="email" required autocomplete="email" placeholder="you@example.com">
          </div>
        </div>
        <div class="grid">
          <div class="field">
            <label for="registerPassword">Пароль</label>
            <input type="password" id="registerPassword" name="password" minlength="8" required autocomplete="new-password" placeholder="Минимум 8 символов">
          </div>
          <div class="field">
            <label for="registerPasswordConfirm">Подтверждение пароля</label>
            <input type="password" id="registerPasswordConfirm" name="passwordConfirm" minlength="8" required autocomplete="new-password">
          </div>
        </div>
        <p class="form-note">Новые аккаунты создаются с ролью «Пользователь».</p>
        <label class="checkbox field">
          <input type="checkbox" id="acceptPolicy" required>
          <span>Я принимаю <a class="link" href="./privacyPolicy.html">политику конфиденциальности</a></span>
        </label>
        <button type="submit" class="primary">Создать аккаунт</button>
      </form>

      <div id="authFeedback" class="feedback" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="../JS/config.js"></script>
  <script src="../JS/auth-check.js"></script>
  <script src="../JS/auth.js" defer></script>
</body>
</html>
